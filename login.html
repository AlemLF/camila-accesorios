<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso privado — Camila Accesorios</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-header">
      <span class="brand-badge">CA</span>
      <h1>Camila Accesorios</h1>
      <p>Ingresa con tus credenciales para administrar el catálogo.</p>
    </div>

    <form id="form-login" class="admin-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@camilaaccesorios.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn btn-primary full-width">Ingresar al panel</button>
      <p id="login-error" class="msg-error" role="alert"></p>
    </form>

    <div class="login-footer">
      <a href="index.html">← Volver a la tienda</a>
    </div>
  </main>

  <script type="module">
    import { login } from './js/auth.js';

    const form = document.getElementById('form-login');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        await login(form.email.value.trim(), form.password.value);
        window.location.href = '/admin.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Correo o contraseña incorrectos.';
        btn.disabled = false;
        btn.textContent = 'Ingresar al panel';
      }
    });
  </script>
</body>
</html>
